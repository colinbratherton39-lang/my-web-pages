<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Down for Maintenance</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:linear-gradient(#162338 0%,#34445a 64%,#30343c 64%);color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}.wrap{width:min(95vw,850px);position:relative;z-index:2;margin-top:-8vh}h1{font-size:clamp(2rem,6vw,4.4rem);margin:0 0 12px;text-shadow:0 4px 15px #0008;letter-spacing:.02em}p{font-size:clamp(1.1rem,2.5vw,1.5rem);color:#f9d88c;margin:0}.scene{position:absolute;bottom:0;left:0;width:100%;height:36vh;min-height:220px;background:#34373e;border-top:8px solid #65676d;overflow:hidden}.line{position:absolute;top:20%;width:100%;height:9px;background:repeating-linear-gradient(90deg,#eac759 0 75px,transparent 75px 135px);opacity:.85}.hole{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:min(64vw,420px);height:110px;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,#06080b 0 48%,#11151b 54%,#717279 61%,#24272c 68%);box-shadow:0 12px 22px #0009}.worker{position:absolute;left:calc(50% + 110px);bottom:21%;width:80px;height:150px;animation:work 1.4s ease-in-out infinite;transform-origin:50% 90%}.head{position:absolute;top:13px;left:24px;width:36px;height:36px;border-radius:50%;background:#f4b77b}.helmet{position:absolute;top:4px;left:18px;width:48px;height:22px;border-radius:35px 35px 5px 5px;background:#f9c331;border-bottom:6px solid #df9815}.torso{position:absolute;top:52px;left:17px;width:48px;height:55px;background:#ff8b23;border-radius:10px;border:5px solid #e8cc53}.legs{position:absolute;top:101px;left:22px;width:14px;height:47px;background:#22334a;box-shadow:23px 0 #22334a}.arm{position:absolute;top:55px;left:8px;width:13px;height:58px;background:#f4b77b;transform:rotate(-25deg);transform-origin:top}.tool{position:absolute;top:84px;left:-1px;width:7px;height:100px;background:#a6afb8;transform:rotate(25deg);transform-origin:top}.tool:after{content:"";position:absolute;bottom:0;left:-13px;width:34px;height:12px;background:#c5cbd2;border-radius:3px}.cone{position:absolute;bottom:13%;width:44px;height:80px;background:repeating-linear-gradient(180deg,#f08c22 0 20px,#fff 20px 35px,#f08c22 35px 52px);clip-path:polygon(38% 0,62% 0,95% 87%,100% 100%,0 100%,5% 87%);filter:drop-shadow(2px 5px 3px #000)}.cone.one{left:calc(50% - 280px)}.cone.two{left:calc(50% + 235px)}.dust{position:absolute;bottom:42%;left:calc(50% + 85px);font-size:30px;animation:dust 1.4s infinite;color:#d7d2c5}@keyframes work{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(9deg)}}@keyframes dust{0%{opacity:0;transform:translateY(15px) scale(.6)}50%{opacity:1}100%{opacity:0;transform:translateY(-24px) scale(1.5)}}@media(max-width:550px){.worker{left:calc(50% + 55px);transform:scale(.75);transform-origin:bottom}.cone.one{left:5%}.cone.two{left:auto;right:5%}.wrap{margin-top:-16vh}}@media(prefers-reduced-motion:reduce){.worker,.dust{animation:none}}
</style>
</head>
<body>
<main class="wrap"><h1>THIS PAGE IS DOWN FOR MAINTENANCE</h1><p>We're fixing things up. Please check back soon!</p></main>
<div class="scene" aria-hidden="true"><div class="line"></div><div class="hole"></div><div class="dust">✦</div><div class="worker"><div class="helmet"></div><div class="head"></div><div class="torso"></div><div class="legs"></div><div class="arm"></div><div class="tool"></div></div><div class="cone one"></div><div class="cone two"></div></div>
</body>
</html>
